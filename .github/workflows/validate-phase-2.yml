name: Validate Phase 2 Worker
on:
  push:
    branches: [phase-2-quote-backend]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Validate Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-validation
      - name: Check generated Worker and binding
        run: |
          test -f dist/_worker.js/index.js
          grep -q '"binding": "QUOTE_FILES"' wrangler.jsonc
          grep -q '"directory": "dist"' wrangler.jsonc
          test -f src/pages/api/quote.js
          grep -q 'RESEND_API_KEY' src/pages/api/quote.js
