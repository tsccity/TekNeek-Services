media:
  input: public/assets
  output: /assets
content:
  - name: homepage
    label: Homepage Content
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: intro, label: Homepage introduction, type: text }
      - { name: servicesIntro, label: Services introduction, type: text }
      - { name: workHeading, label: Work gallery heading, type: string }
      - { name: contactIntro, label: Contact introduction, type: text }
  - name: catalogs
    label: Creative Catalog Links
    type: file
    path: src/data/catalogs.json
    format: json
    fields:
      - name: items
        label: Catalogs
        type: object
        list: true
        fields:
          - { name: title, label: Catalog name, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: External URL, type: string }
  - name: tops-tees-gallery
    label: Tops & Tees Gallery
    type: file
    path: src/data/tops-tees-gallery.json
    format: json
    fields:
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Project name, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Project photo, type: image }
          - { name: featured, label: Feature on homepage, type: boolean }
  - name: creative-gallery
    label: Creative Gallery
    type: file
    path: src/data/creative-gallery.json
    format: json
    fields:
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Product name, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Product photo, type: image }
          - { name: featured, label: Feature on homepage, type: boolean }
  - name: digital
    label: Digital Services
    type: file
    path: src/data/digital.json
    format: json
    fields:
      - { name: heading, label: Page heading, type: string }
      - { name: intro, label: Introduction, type: text }
      - name: services
        label: Services
        type: object
        list: true
        fields:
          - { name: title, label: Service title, type: string }
          - { name: description, label: Service description, type: text }
          - { name: link, label: Internal link (optional), type: string }
  - name: connect
    label: TekNeek Connect
    type: file
    path: src/data/connect.json
    format: json
    fields:
      - { name: heading, label: Page heading, type: string }
      - { name: intro, label: Introduction, type: text }
      - name: steps
        label: How it works
        type: object
        list: true
        fields:
          - { name: title, label: Step title, type: string }
          - { name: description, label: Step description, type: text }
      - { name: businessHeading, label: Business section heading, type: string }
      - { name: businessDescription, label: Business section description, type: text }
      - { name: notice, label: Important service limitations, type: text }
